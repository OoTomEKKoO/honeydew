name: Android debug APK

# A debug build for trying changes on a phone: no signing secrets, no release. It installs as "Honeydew Debug"
# (its own app id), beside the released Honeydew. Download the artifact from the run's page; it holds one APK.
on:
  push:
    branches: ["claude/**"]
  # `ref`: build that commit instead, for comparing against the original code (same app id and signing key, so it
  # installs over this build and keeps its settings).
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build instead of this branch (empty = this branch)"
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to the commit to compare
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          cp android/debug.keystore "$RUNNER_TEMP/debug.keystore"
          git checkout --force "$REF"
          cp "$RUNNER_TEMP/debug.keystore" android/debug.keystore
          echo "ARTIFACT=honeydew-android-debug-${REF:0:7}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      # `--base`: without the bundled sounds (the app downloads them on first start), which keeps the APK small and the
      # build short.
      - name: Build the debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          tools/android-dist.sh --base
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT || 'honeydew-android-debug' }}
          path: target/honeydew-android-*-arm-base-debug.apk
          if-no-files-found: error
          retention-days: 30
